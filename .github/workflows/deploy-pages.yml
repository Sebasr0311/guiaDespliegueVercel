name: Publicar DeployLab en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Resolver prefijo de GitHub Pages
        id: base
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          if [[ "$REPOSITORY_NAME" == "$OWNER_NAME.github.io" ]]; then
            echo "repo_name=" >> "$GITHUB_OUTPUT"
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "repo_name=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
            echo "base_path=/$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Exportar sitio estático de Next.js
        env:
          REPO_NAME: ${{ steps.base.outputs.repo_name }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.base_path }}
        run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
